name: Docker Publish

# Builds and pushes the fork image to GHCR on every push to main —
# NAS then deploys with `docker compose pull && up -d`, same as lingarr.
# GITHUB_TOKEN carries packages:write, no extra secrets needed; the first
# package lands private by default (flip to public after first push).
#
# amd64 only (QNAP NAS); add linux/arm64 back when needed — the Dockerfile
# cross-compiles per TARGETARCH on the build host (--platform=$BUILDPLATFORM),
# so no QEMU step is required either way.
#
# Version note: FLUXDOWN_APP_VERSION = nearest upstream release tag reachable
# from HEAD (git describe), so the in-app "new version available" banner fires
# exactly when upstream has released something this fork hasn't synced yet —
# flip it off by syncing the fork and pushing a fresh build. Falls back to
# 0.0.<run_number> only if no tag is reachable (never expected).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version from nearest upstream release tag
        id: version
        run: |
          git fetch https://github.com/zerx-lab/FluxDown.git '+refs/tags/*:refs/tags/*'
          version=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' | cut -d- -f1)
          if [ -z "$version" ]; then version="0.0.${{ github.run_number }}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/server.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FLUXDOWN_APP_VERSION=${{ steps.version.outputs.version }}
